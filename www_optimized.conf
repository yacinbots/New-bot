; ══════════════════════════════════════════════════════
; PHP-FPM Pool Config — High Traffic Bot (130K+ users)
; Boss man's settings for 1M+ messages/day capacity
; ══════════════════════════════════════════════════════

[www]
user  = www-data
group = www-data

listen = /run/php/php8.1-fpm.sock
listen.owner = www-data
listen.group = www-data

; ── Process Manager ──────────────────────────────────
; dynamic: يبدأ بعدد معقول ويكبّر عند الضغط
pm = dynamic

; السيرفر 7.8GB RAM + 2 cores
; كل worker ≈ 27MB → 180 worker = ~4.8GB (يترك هامش للـ OS)
pm.max_children      = 180
pm.start_servers     = 30
pm.min_spare_servers = 15
pm.max_spare_servers = 50

; يُعيد spawn الـ worker بعد 500 request — يمنع memory leaks
pm.max_requests = 500

; ── Timeouts ─────────────────────────────────────────
; الـ bot request يجب ينتهي خلال 30 ثانية max
request_terminate_timeout = 30s

; ── Logging ──────────────────────────────────────────
pm.status_path = /status
slowlog        = /var/log/php8.1-fpm-slow.log
request_slowlog_timeout = 5s

; ── PHP Settings (per-pool overrides) ────────────────
php_admin_value[memory_limit]          = 64M
php_admin_value[max_execution_time]    = 30
php_admin_value[opcache.enable]        = 1
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.max_accelerated_files] = 4000
php_admin_value[opcache.validate_timestamps] = 0

; APCu للـ in-memory caching (dedup + session cache)
php_admin_value[apc.enabled]           = 1
php_admin_value[apc.shm_size]          = 64M

; ── Emergency brakes ─────────────────────────────────
; إذا امتلأت queue الـ requests، يرفض بدل ما يعلق الكل
listen.backlog = 512
